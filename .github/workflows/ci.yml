name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  biome:
    name: Biome
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/biome.yml@main

  kotlin-lint-library:
    name: Kotlin lint (library)
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/kotlin-lint.yml@main
    with:
      compose-multiplatform: true

  kotlin-lint-example:
    name: Kotlin lint (example)
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/kotlin-lint.yml@main
    with:
      compose-multiplatform: true
      working-directory: example

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the JDK and Gradle
        uses: yuyuyuyuyu-dev/repo-config/.github/actions/setup-jdk-and-gradle@main
        with:
          compose-multiplatform: true

      - name: Run tests
        run: ./gradlew allTest
