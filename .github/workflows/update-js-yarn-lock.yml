name: Update the JS yarn.lock

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions: {}

concurrency: chore/update-js-yarn-lock

jobs:
  regenerate:
    name: Regenerate the JS yarn.lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Check out the repository
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up the JDK and Gradle
        uses: yuyuyuyuyu-dev/repo-config/.github/actions/setup-jdk-and-gradle@main
        with:
          compose-multiplatform: true

      - name: Regenerate the JS yarn.lock
        run: |
          rm -f kotlin-js-store/yarn.lock build/js/yarn.lock
          ./gradlew kotlinUpgradeYarnLock

      - name: Upload the JS yarn.lock
        uses: actions/upload-artifact@v7
        with:
          name: js-yarn-lock
          path: kotlin-js-store/yarn.lock
          if-no-files-found: error
          retention-days: 1

  pull-request:
    name: Open or update the pull request
    needs: regenerate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create a token for the app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.regenerate.outputs.commit }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Download the JS yarn.lock
        uses: actions/download-artifact@v8
        with:
          name: js-yarn-lock
          path: kotlin-js-store

      - name: Open or update the pull request
        id: pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ github.event.repository.default_branch }}
          sign-commits: true
          add-paths: kotlin-js-store/yarn.lock
          branch: chore/update-js-yarn-lock
          delete-branch: true
          commit-message: "build(deps): update the JS yarn.lock"
          title: "build(deps): update the JS yarn.lock"
          body: "`kotlin-js-store/yarn.lock` was deleted and resolved again, so every npm package moved to the newest version its range allows. Upgrading the stored `yarn.lock` instead would keep the versions it already has."
          labels: dependencies

      - name: Enable auto-merge
        if: steps.pull-request.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.pull-request-url }}
        run: gh pr merge --auto --squash "$PULL_REQUEST"
